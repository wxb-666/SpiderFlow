services:
  mysql:
    image: mysql:8.0
    container_name: spiderflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${APP_TIMEZONE:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spiderflow-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./spiderflow:/app/spiderflow
      - ./scrapy.cfg:/app/scrapy.cfg
      - ./data:/app/data

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spiderflow-scheduler
    restart: unless-stopped
    command: ["python", "-m", "spiderflow.scheduler.main"]
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      SCHEDULE_HOUR: ${SCHEDULE_HOUR:-17}
      SCHEDULE_MINUTE: ${SCHEDULE_MINUTE:-0}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./spiderflow:/app/spiderflow
      - ./scrapy.cfg:/app/scrapy.cfg
      - ./data:/app/data

volumes:
  mysql_data:
